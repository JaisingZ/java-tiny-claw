    <text x="40" y="236" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">runtime control layer</text>

    <path d="M248 290V318" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

    <rect x="0" y="328" width="78" height="70" rx="14" fill="#1D4ED8"/>
