<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Tiny Agent Harness social preview</title>
  <desc id="desc">Tiny Agent Harness, a Java runtime layer beneath agents. Model decides, Harness owns execution.</desc>

  <rect width="1280" height="640" fill="#0B1020"/>
  <rect x="64" y="64" width="1152" height="512" rx="32" fill="#111827" stroke="#263244" stroke-width="2"/>

  <text x="104" y="190" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800">Tiny Agent</text>
  <text x="104" y="268" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="68" font-weight="800">Harness</text>
  <text x="108" y="328" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="600">Build the runtime layer</text>
  <text x="108" y="366" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="29" font-weight="600">beneath agents.</text>
  <text x="108" y="426" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Model decides. Harness owns execution.</text>

  <rect x="108" y="468" width="118" height="42" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="132" y="496" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Java 21</text>
  <rect x="246" y="468" width="112" height="42" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="276" y="496" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Maven</text>
  <rect x="378" y="468" width="172" height="42" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="402" y="496" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Experimental</text>

  <g transform="translate(668 104)">
