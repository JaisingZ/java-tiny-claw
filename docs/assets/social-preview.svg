    <text x="108" y="68" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">decision output</text>

    <path d="M248 98V126" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>

    <rect x="0" y="136" width="496" height="144" rx="24" fill="#0F766E"/>
